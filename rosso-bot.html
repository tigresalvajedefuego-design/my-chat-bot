<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat con TIGRE</title>
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    background: #f0f2f5;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .msg {
    max-width: 80%;
    margin-bottom: 10px;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
  }
  .bot {
    background: #e4e6eb;
    color: #050505;
    align-self: flex-start;
  }
  .user {
    background: #0084ff;
    color: white;
    margin-left: auto;
  }
  #options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 16px 16px 16px;
  }
  .opt-btn {
    background: #1c1e21;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 16px;
  }
  #inputArea {
    display: none;
    padding: 12px 16px;
    border-top: 1px solid #ddd;
    background: white;
  }
  #inputArea input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
  }
  #sendBtn {
    margin-top: 8px;
    width: 100%;
    background: #0084ff;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 16px;
  }
</style>
</head>
<body>

<div id="chat"></div>
<div id="options"></div>
<div id="inputArea">
  <input type="text" id="userInput" placeholder="Escribe aquí...">
  <button id="sendBtn">Enviar</button>
</div>

<script>
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz162SCOzgSk322oYq3HtW0i6wWIfJ5mGkpXvA2eWCsL9SJ-xkdv_H57eiPa1uuGd4/exec";

const sessionId = "sess-" + Date.now() + "-" + Math.random().toString(36).substring(2, 8);

let userData = {
  nombre: "",
  telefono: "",
  seccion: ""
};

const chat = document.getElementById("chat");
const optionsDiv = document.getElementById("options");
const inputArea = document.getElementById("inputArea");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

function addBotMessage(text) {
  const div = document.createElement("div");
  div.className = "msg bot";
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addUserMessage(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function clearOptions() {
  optionsDiv.innerHTML = "";
}

function showOptions(options, callback) {
  clearOptions();
  inputArea.style.display = "none";
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = opt;
    btn.onclick = () => {
      addUserMessage(opt);
      clearOptions();
      callback(opt);
    };
    optionsDiv.appendChild(btn);
  });
}

function showTextInput(placeholder, callback) {
  clearOptions();
  inputArea.style.display = "block";
  userInput.value = "";
  userInput.placeholder = placeholder;
  userInput.focus();

  function handleSend() {
    const val = userInput.value.trim();
    if (!val) return;
    addUserMessage(val);
    inputArea.style.display = "none";
    sendBtn.onclick = null;
    userInput.onkeydown = null;
    callback(val);
  }

  sendBtn.onclick = handleSend;
  userInput.onkeydown = function(e) {
    if (e.key === "Enter") handleSend();
  };
}

function enviarDatos(mensaje) {
  fetch(WEBHOOK_URL, {
    method: "POST",
    body: JSON.stringify({
      nombre: userData.nombre,
      telefono: userData.telefono,
      sessionId: sessionId,
      seccion: userData.seccion,
      mensaje: mensaje
    })
  }).catch(err => console.error("Error al enviar datos:", err));
}

function iniciar() {
  addBotMessage("¡Hola! Bienvenido/a. Antes de continuar, necesito algunos datos.");
  setTimeout(() => {
    addBotMessage("¿Cuál es tu nombre completo?");
    showTextInput("Tu nombre completo", (nombre) => {
      userData.nombre = nombre;
      pedirTelefono();
    });
  }, 500);
}

function pedirTelefono() {
  addBotMessage("Gracias, " + userData.nombre + ". Ahora, ¿cuál es tu número de teléfono?");
  showTextInput("Tu número de teléfono", (telefono) => {
    userData.telefono = telefono;
    mostrarMenu();
  });
}

function mostrarMenu() {
  addBotMessage("Perfecto. ¿En qué puedo ayudarte?");
  showOptions(
    ["Vacantes", "Datos personales", "Finanzas", "Legalización", "Vivienda", "Trabajo"],
    (seccion) => {
      userData.seccion = seccion;
      pedirMensaje();
    }
  );
}

function pedirMensaje() {
  addBotMessage("Escribe tu pregunta o mensaje sobre \"" + userData.seccion + "\":");
  showTextInput("Escribe tu mensaje...", (mensaje) => {
    enviarDatos(mensaje);
    addBotMessage("Gracias, hemos recibido tu mensaje. Te responderemos pronto.");
    setTimeout(() => {
      addBotMessage("¿Necesitas algo más?");
      showOptions(["Sí, otra consulta", "No, gracias"], (resp) => {
        if (resp === "Sí, otra consulta") {
          mostrarMenu();
        } else {
          addBotMessage("¡Gracias por escribirnos! Que tengas un buen día. 👋");
        }
      });
    }, 800);
  });
}

iniciar();
</script>

</body>
</html>
